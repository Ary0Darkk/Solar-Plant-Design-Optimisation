# ==============================================================================
# Concentrated Solar Power (CSP) Plant Design & Operation Optimization
# Global Pipeline Configuration (YAML)
# ==============================================================================

# ------------------------------------------------------------------------------
# Genetic Algorithm (GA) Parameters & Memory Recycling
# ------------------------------------------------------------------------------
ga:
  pop_size: 112
  num_generations: 100
  tournament_size: 7
  hall_of_fame_size: 5
  cxpb: 0.8
  mutpb: 0.2
  indpb: 0.1
  random_seed: 41
  resume_from_checkpoint: true
  checkpoint_interval: 1
  # Child process recycling to clear PySAM C-level memory leaks
  max_tasks_per_child: 25
  # Explicit garbage collection after each evaluation wave
  enable_gc_collection: true
  # Early stopping patience (stop if best fitness stagnant for N gens, 0=disabled)
  early_stopping_patience: 15

# ------------------------------------------------------------------------------
# Dynamic Tariff & Electricity Pricing
# ------------------------------------------------------------------------------
tariff:
  min_price: 3.0
  max_price: 8.0
  demand_file: "electricity_data/Yearly Demand Profile Haryana-Himanchal.xlsx"
  cache_file: "electricity_data/dynamic_price_data_haryana.csv"

# ------------------------------------------------------------------------------
# PySAM Physical Simulation Model
# ------------------------------------------------------------------------------
simulation:
  json_file: "simulation/Gurgaon_plant.json"
  model_name: "PhysicalTroughNone"
  penalty: -1.0e+13
  log_each_simulation: false

# ------------------------------------------------------------------------------
# Physical Design Parameter Bounds (Season-wide, 5 variables)
# Format: [lower_bound, upper_bound]
# ------------------------------------------------------------------------------
design_bounds:
  # Total reflective aperture area [m²]
  specified_total_aperture: [8000, 12000]
  # Pitch distance between collector rows [m] (must exceed W_aperture)
  Row_Distance: [10, 25]
  # Solar Collector Assemblies (SCAs) per loop
  ColperSCA: [2, 10]
  # Aperture width of collector trough [m]
  W_aperture: [4, 8]
  # Length of single Solar Collector Assembly [m]
  L_SCA: [50, 200]

# ------------------------------------------------------------------------------
# Daily Operational Parameter Bounds (Per-day, 3 variables)
# Format: [lower_bound, upper_bound]
# ------------------------------------------------------------------------------
operational_bounds:
  # HTF mass flow rate limit [kg/s]
  m_dot: [2, 12]
  # Field startup temperature threshold [°C]
  T_startup: [300, 380]
  # Field shutdown temperature threshold [°C] (must be <= T_startup)
  T_shutdown: [250, 300]

# ------------------------------------------------------------------------------
# Representative Weather Days per Season (7 days each: [month, day])
# ------------------------------------------------------------------------------
seasons:
  winter:
    - [1, 8]
    - [1, 13]
    - [1, 16]
    - [1, 28]
    - [2, 21]
    - [2, 22]
    - [12, 12]
  summer:
    - [3, 9]
    - [3, 16]
    - [4, 12]
    - [4, 17]
    - [5, 7]
    - [5, 16]
    - [5, 21]
  monsoon:
    - [6, 13]
    - [7, 6]
    - [7, 15]
    - [7, 22]
    - [7, 23]
    - [8, 4]
    - [8, 11]
  post:
    - [9, 5]
    - [9, 20]
    - [10, 3]
    - [10, 12]
    - [11, 3]
    - [11, 17]
    - [11, 23]
