[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "solar-opt"
version = "1.0.0"
description = "Season-wise Concentrated Solar Power (CSP) genetic algorithm optimisation using PySAM and DEAP"
readme = "Readme.md"
requires-python = ">=3.12"
dependencies = [
    "dagshub>=0.6.3",
    "deap>=1.4.3",
    "matplotlib>=3.10.7",
    "mlflow>=3.6.0",
    "mpi4py>=4.1.2",
    "nrel-pysam>=7.1.0",
    "openpyxl>=3.1.5",
    "pandas>=2.2.0",
    "python-dotenv>=1.0.0",
    "ruff>=0.14.9",
    "tabulate>=0.9.0",
]

[project.scripts]
solar-opt = "optimized_pipeline.cli:main"

[dependency-groups]
dev = [
    "hatchling>=1.32.4",
    "pytest>=9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["optimized_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

